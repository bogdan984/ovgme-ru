    <br>
Функция снимка позволяет создать снимок дерева файлов корневой папки текущей
конфигурации вместе с контрольными суммами.<br>
После создания снимка его можно сравнить с текущим состоянием дерева файлов
корневой папки и узнать, какие файлы были добавлены, удалены или изменены.
